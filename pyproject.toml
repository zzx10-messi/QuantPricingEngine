[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-pricing-engine"
version = "0.2.1"
description = "A modular Python project for European option pricing and risk analysis."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "QuantPricingEngine" }
]
keywords = ["quantitative-finance", "options", "black-scholes", "greeks", "pricing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/zzx10-messi/QuantPricingEngine"
Repository = "https://github.com/zzx10-messi/QuantPricingEngine"

[tool.setuptools.packages.find]
where = ["."]
include = ["option_pricing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
